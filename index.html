 $('#app').innerHTML=`<main class="ranking-home"><header class="ranking-header">${brand()}<div class="steps">${me?'<button id="go-class">나의 학습실 →</button>':'<button id="home-student">학생 로그인 →</button><button class="secondary" id="home-admin">관리자 로그인</button>'}</div></header><section class="ranking-intro"><span class="eyebrow">함께 도전하는 수학 공부</span><h1>별내스마트러닝센터 중등 수학 · 학년별 학습실</h1><p>학년을 선택하고, 나에게 맞는 속도로 완주하세요.</p></section><section class="card"><h2>학년별 수업계획 미리보기</h2>${gradeTabs()}<label>학습 기간<select id="preview-days"><option value="30">30일 수업계획</option><option value="50" selected>50일 수업계획</option><option value="70">70일 수업계획</option></select></label><div id="plan-preview"></div></section><section class="card ranking-board"><div class="section-top"><div><h2>우리 센터 학습 랭킹</h2><small>진도율순 · 진도율과 완료 일수가 같으면 공동 순위</small></div><button class="secondary" id="refresh-ranking">새로고침</button></div><div id="ranking-content" aria-live="polite"><p class="muted">학습 현황을 불러오는 중입니다.</p></div><small>이름은 가운데 글자를 가려 표시합니다. 진도율은 각 학생이 선택한 계획의 전체 활동 수를 기준으로 계산합니다.</small></section></main>`;
 const preview=()=>{if(!GR[curGrade].ready){$('#plan-preview').innerHTML='<p class="note">'+curGrade+' 강의는 준비 중입니다.</p>';return;}$('#plan-preview').innerHTML='<div class="table-wrap" style="max-height:420px;overflow:auto"><table><thead><tr><th>일차</th><th>학습 내용</th><th>강의 시간</th></tr></thead><tbody>'+GR[curGrade].plans[$('#preview-days').value].map(p=>`<tr><td>${p.day}일차</td><td>${p.lessons.map(l=>esc(lessonLabel(l)+' '+l.title)+' <small>('+l.duration+')</small>').join('<br>')}</td><td>약 ${p.minutes}분</td></tr>`).join('')+'</tbody></table></div>';};$('#preview-days').onchange=preview;preview();document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{curGrade=b.dataset.grade;document.querySelectorAll('[data-grade]').forEach(x=>{const on=x.dataset.grade===curGrade;x.classList.toggle('secondary',!on);x.setAttribute('aria-selected',on)});preview()});
 if($('#go-class'))$('#go-class').onclick=()=>render();
 if($('#home-student'))$('#home-student').onclick=()=>login('student');
 if($('#home-admin'))$('#home-admin').onclick=()=>login('admin');
 $('#refresh-ranking').onclick=()=>refreshRanking();refreshRanking();
}
async function refreshRanking(){const n=++rankingRequest,el=$('#ranking-content');if(!el)return;const button=$('#refresh-ranking');if(!ready){el.innerHTML='<p class="muted">서버 연결 후 학생들의 학습 랭킹이 표시됩니다.</p>';return;}button.disabled=true;try{const rows=await request('/rest/v1/rpc/center_ranking',{method:'POST',body:{},auth:false});if(n!==rankingRequest||!$('#ranking-content'))return;el.innerHTML=rows.length?'<div class="table-wrap"><table><thead><tr><th>순위</th><th>학생</th><th>학년</th><th>수업계획</th><th>학습 진도율</th><th>완료 일수</th><th>완주</th></tr></thead><tbody>'+rows.map(r=>`<tr><td><span class="rank-number">${r.rank}위</span></td><td><strong>${esc(r.name)}</strong></td><td>${esc(r.grade||"")}</td><td><span class="tag">${Number(r.plan_days)}일 계획</span></td><td>${r.percent}%<progress max="100" value="${Number(r.percent)}" aria-label="${esc(r.name)} 진도율"></progress></td><td>${r.completed} / ${r.plan_days}일</td><td><span class="tag">${r.finished?'완주 완료 ✓':r.completed?'학습 중':'도전 시작'}</span></td></tr>`).join('')+'</tbody></table></div>':'<p class="ranking-empty">첫 번째 도전을 기다리고 있어요.<br>학생이 등록되면 이곳에 학습 현황이 표시됩니다.</p>';}catch(x){if(n===rankingRequest&&$('#ranking-content'))el.innerHTML='<p class="error">'+esc(x.message)+'</p>';}finally{button.disabled=false;}}
function plannedDate(start,day){if(!start)return '';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(start);if(!m)return '';const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]+day-1));return d.toISOString().slice(0,10);}
function dayLabel(person,day){const d=plannedDate(person.start_date,day);return d?d.slice(5).replace('-','/'):(day+'일차');}
function dateSettings(person){const overdue=overdueDays(person);return `<section class="card date-settings"><div><h2>나의 ${plan.length}일 학습 일정</h2><p>${curGrade} ${lessonsOf().length}강 · 하루 ${[...new Set(plan.map(p=>p.lessons.length))].sort().join('~')}강 순서대로 학습</p><p>${person.start_date?esc(person.start_date)+' 시작 · '+plannedDate(person.start_date,plan.length)+' 마지막 학습일':'시작일을 선택해 주세요.'}</p><small>시작일 포함 연속 일정입니다. 계획 변경 시 각 계획의 체크·메모·오답 기록을 별도로 보관하며, 해당 계획으로 돌아오면 다시 표시합니다. 시작일은 공통 적용됩니다.</small>${overdue.length?'<p class="overdue-status">밀린 학습 '+overdue.length+'일</p>':''}</div>${adminTarget?'':`<form id="start-date-form"><label>수업계획<select name="plan_days">${[30,50,70].map(n=>`<option value="${n}" ${n===plan.length?'selected':''}>${n}일 수업계획</option>`).join('')}</select></label><label>학습 시작일<input name="start" type="date" min="2000-01-01" max="2100-12-31" required value="${esc(person.start_date||'')}"></label><button type="submit">계획 · 일정 적용</button><span id="date-error" class="error" role="alert"></span></form>`}</section>`;}

let warnedOn='';
function koreaToday(now=new Date()){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);}
function overdueDays(person,today=koreaToday()){if(!person?.start_date)return [];return plan.filter(p=>plannedDate(person.start_date,p.day)<today&&!record(p.day,person.id).checks.every(Boolean));}
function showOverdueWarning(){if(me?.role!=='student'||adminTarget)return;const today=koreaToday(),key=me.id+':'+today+':'+me.start_date;if(warnedOn===key)return;const days=overdueDays(me,today);if(!days.length)return;warnedOn=key;const dialog=document.createElement('dialog');dialog.className='overdue-dialog';dialog.setAttribute('aria-labelledby','overdue-title');dialog.innerHTML=`<span class="tag">학습 일정 확인</span><h2 id="overdue-title">예정일이 지난 학습이 ${days.length}일 있어요</h2><p>${dayLabel(me,days[0].day)}부터 완료하지 않은 학습이 있습니다.<br>인강·문제·채점·오답 체크를 확인하고 차근차근 이어가요.</p><p class="muted">${days.slice(0,8).map(p=>dayLabel(me,p.day)).join(', ')}${days.length>8?' 외 '+(days.length-8)+'일':''}</p><div class="steps"><button id="overdue-go">밀린 학습 확인하기</button><button class="secondary" id="overdue-close">나중에 확인</button></div>`;document.body.append(dialog);dialog.addEventListener('close',()=>dialog.remove(),{once:true});dialog.querySelector('#overdue-go').onclick=()=>{dialog.close();selected=days[0].day;view='study';render();};dialog.querySelector('#overdue-close').onclick=()=>dialog.close();dialog.showModal();}

function login(role=null){
 if(!role){home();return;}
 me=null;gradeSet=false;
 const admin=role==='admin';
 $('#app').innerHTML=`<main class="login"><section class="login-left">${brand()}<div><span class="eyebrow">MY MATH JOURNEY</span><h1>별내스마트러닝센터에서 하는<br><em>중등 수학 · 학년별 학습실</em></h1><p class="muted">강의를 듣고, 스스로 풀고, 다시 확인해요.</p><div class="steps"><span>중1 · 중2 · 중3 학년별 강의</span><span>30·50·70일 선택</span><span>나만의 학습 기록</span></div></div><small>레고에듀케이션 별내스마트러닝센터</small></section><section class="login-right"><div class="login-card"><span class="tag">중등 수학 · 학년별 학습실</span>${!role?'<h2 style="margin-top:24px">학습실에 오신 것을 환영합니다</h2><p class="muted">이용할 페이지를 선택해 주세요.</p><div class="entry-options"><button id="student-entry"><strong>학생 페이지 →</strong><span>오늘의 학습과 나의 진도 확인</span></button><button class="secondary" id="admin-entry"><strong>관리자 페이지 →</strong><span>학생 계정 발급과 학습 관리</span></button></div>':`<h2 style="margin-top:24px">${admin?'관리자 로그인':'학생 로그인'}</h2><p class="muted">${admin?'관리자 계정으로 학생들의 학습을 관리하세요.':'센터에서 발급받은 계정으로 로그인하세요.'}</p><form id="login"><label>아이디<input name="username" autocomplete="username" value="${admin?'admin':''}" placeholder="${admin?'관리자 아이디':'학생 아이디'}" required maxlength="80"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required></label><p class="error" id="login-error" role="alert"></p><button type="submit">${admin?'관리자 페이지 로그인':'학생 페이지 로그인'} →</button></form><button class="quiet" id="back-home">← 메인 화면</button>`}${!ready?'<p class="note" style="margin-top:24px">로그인 서비스 연결 준비 중입니다. 센터에서 최초 설정을 마친 뒤 이용할 수 있습니다.</p>':''}</div></section></main>`;
 if(!role){$('#student-entry').onclick=()=>login('student');$('#admin-entry').onclick=()=>login('admin');return;}
 $('#back-home').onclick=()=>login();
 $('#login').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const f=new FormData(e.target);const username=f.get('username').trim().toLowerCase();const result=await request('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:username.includes('@')?username:username+'@students.center.invalid',password:f.get('password')}});remember({...result,expires_at:Date.now()/1000+result.expires_in});await load();if(me.role!==role){remember(null);me=null;records=[];students=[];throw Error(admin?'관리자 계정으로 로그인해 주세요.':'학생 계정으로 로그인해 주세요.');}warnedOn='';view=admin?'admin':'study';render()}catch(x){$('#login-error').textContent=x.message}finally{b.disabled=false}};
}
async function load(){const profiles=await request('/rest/v1/profiles?select=*');me=profiles.find(p=>p.id===session.user.id);if(!me)throw Error('등록된 학생 정보가 없습니다. 센터에 문의해 주세요.');students=profiles.filter(p=>p.role==='student');[records,links]=await Promise.all([request('/rest/v1/progress?select=*'),request('/rest/v1/lecture_links?select=*')]);if(!gradeSet){curGrade=me.role==='student'?gradeOf(me):'중1';gradeSet=true;}plan=planFor(adminTarget||me.id);selected=plan.find(p=>!record(p.day,me.id).checks.every(Boolean))?.day||plan.length;}
function render(){plan=planFor(adminTarget||me.id);selected=Math.max(1,Math.min(selected,plan.length||1));dirty=false;const admin=me.role==='admin';$('#app').innerHTML=`<div class="layout"><aside class="sidebar">${brand()}<nav class="nav" aria-label="주 메뉴"><button id="ranking-nav">🏆 학습 랭킹</button>${admin?`<button data-view="admin" class="${view==='admin'?'active':''}">▦ 학생 진도 관리</button><button data-view="links" class="${view==='links'?'active':''}">▷ 강의 링크 관리</button>`:`<button data-view="study" class="${view==='study'?'active':''}">▦ 나의 학습실</button>`}<button data-view="account" class="${view==='account'?'active':''}">○ 내 계정</button><button id="logout">↪ 로그아웃</button></nav><div class="side-bottom"><strong>하루의 공부를 한눈에</strong><br>인강 → 문제 → 채점 → 오답<br><br>별내스마트러닝센터<br><span class="muted">중등 수학 학년별 학습 프로그램</span></div></aside><main class="workspace"><header class="topbar"><span>중등 수학 · 학년별 학습실 <span class="muted"> / ${admin?'관리자 학습 관리':'나의 학습실'}</span></span><span><span class="avatar">${esc(me.name.slice(0,1))}</span>${esc(me.name)} ${admin?'선생님':'학생'}</span></header><div id="content"></div><footer>© 별내스마트러닝센터</footer></main></div>`;
 $('#ranking-nav').onclick=()=>navigate(home);
 $('#content').innerHTML=view==='admin'?adminView():view==='links'?linksView():view==='account'?accountView():studyView();
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(()=>{view=b.dataset.view;adminTarget=null;render()}));
 $('#logout').onclick=()=>navigate(async()=>{try{await request('/auth/v1/logout',{method:'POST'})}catch{}remember(null);me=null;records=[];students=[];gradeSet=false;login()});
 bind();
 showOverdueWarning();
}
function navigate(fn){if(busy)return;if(dirty&&!confirm('저장하지 않은 내용이 있습니다. 이동하시겠어요?'))return;fn()}
function studyView(){const person=adminTarget?students.find(s=>s.id===adminTarget):me;if(!GR[curGrade].ready)return `<div class="heading"><div><h1>${adminTarget?esc(person.name)+' 학생의 학습 기록':'중등 수학 학년별 학습실'}</h1><p>학년을 선택해 강의를 확인하세요.</p></div></div>${gradeTabs()}<section class="card"><h2>${curGrade} 강의는 준비 중입니다</h2><p class="muted">강의가 준비되면 이곳에서 학습할 수 있어요.</p></section>`;const m=metric(person.id),r=record(selected),p=plan[selected-1];const percent=Math.round(m.checks/(daysFor(person.id)*4)*1000)/10;return `<div class="heading"><div><h1>${adminTarget?esc(person.name)+' 학생의 학습 기록':'오늘도 한 걸음, 수학 공부'}</h1><p>${adminTarget?'학생이 저장한 기록을 확인해 주세요.':'오늘의 학습을 마치고 네 가지 활동을 체크해 주세요.'}</p></div><span class="tag">${curGrade} · ${plan.length}일 완주 챌린지</span></div>${gradeTabs()}${dateSettings(person)}<section class="stats"><div class="card stat primary"><small>전체 학습 진도</small><strong>${percent}%</strong><small>완료 활동 ${m.checks} / ${plan.length*4}개</small><progress value="${m.checks}" max="${plan.length*4}" aria-label="전체 학습 진도"></progress></div><div class="card stat"><small>완료한 학습일</small><strong>${m.done} <small>/ ${plan.length}일</small></strong><small>네 가지 활동을 모두 완료한 날</small></div><div class="card stat"><small>수강 완료 강의</small><strong>${m.lectures} <small>/ ${lessonsOf().length}강</small></strong><small>누적 공부 시간 ${m.minutes}분</small></div></section><div class="content-grid"><div class="stack" style="grid-template-columns:1fr"><section class="card"><div class="section-top"><h2>${plan.length}일 학습 여정</h2><small>학습일을 선택하세요</small></div><div class="day-grid">${plan.map(d=>`<button class="day-btn ${d.day%(plan.length/5)===0?'review':''} ${record(d.day).checks.every(Boolean)?'complete':''} ${selected===d.day?'current':''}" data-day="${d.day}" aria-pressed="${selected===d.day}">${dayLabel(person,d.day)}<small>${d.day%(plan.length/5)===0?'학습·복습':record(d.day).checks.every(Boolean)?'완료':person.start_date?'학습':d.day+'일차'}</small></button>`).join('')}</div><div class="legend"><span>초록 · 완료</span><span>노랑 · 복습일</span><span>테두리 · 선택한 날</span></div></section><section class="card"><div class="section-top"><h2>${dayLabel(person,selected)} · ${p.review?'복습과 점검':'오늘의 학습'}</h2><span class="tag">${p.review?'복습하는 날':`인강 ${p.minutes}분`}</span></div>${p.lessons.map(l=>{const url=links.find(x=>x.grade===curGrade&&x.lecture===l.number)?.url;return `<div class="lesson"><span class="lesson-num">${lessonLabel(l)}</span><div class="lesson-copy"><h3>${esc(l.title)}</h3><small>${esc(l.book)} · ${l.duration}${l.pages?' · 교재 '+esc(l.pages)+'쪽':''}</small></div>${url&&validUrl(url)?`<a class="button secondary" href="${esc(url)}" target="_blank" rel="noopener noreferrer">강의 보기 ↗</a>`:'<small>강의 링크 등록 대기</small>'}</div>`}).join('')}${selected%(plan.length/5)===0?'<p class="note">구간 복습: 오늘 강의까지 학습한 뒤, 이번 구간의 오답을 다시 풀어보세요. 마지막 날에는 ${curGrade} 전체를 점검하세요.</p>':''}<p class="note">강의 사이에 쉬는 시간을 갖고, 문제 풀이와 오답 복습을 진행하세요.</p><form id="daily"><div class="check-list">${activities.map((a,i)=>`<label class="check-item"><input type="checkbox" name="check${i}" ${r.checks[i]?'checked':''} ${adminTarget?'disabled':''}>${a}${p.review&&i===0?' (취약 강의 복습)':''}</label>`).join('')}</div><div class="form-grid"><label>전체 문항 수<input type="number" min="0" max="1000" name="total" value="${r.total??''}" ${adminTarget?'disabled':''}></label><label>공부한 시간 (분)<input type="number" min="0" max="1440" name="minutes" value="${r.minutes??''}" ${adminTarget?'disabled':''}></label><label>실제 학습 날짜<input type="date" name="study_date" value="${esc(r.study_date||'')}" ${adminTarget?'disabled':''}></label>${mistakesEditor(r)}<label class="full">핵심 개념 · 오답 · 다음 목표<textarea name="note" maxlength="3000" placeholder="어려웠던 개념, 다시 볼 강의나 틀린 문항을 적어 보세요." ${adminTarget?'disabled':''}>${esc(r.note)}</textarea></label></div><p class="error" id="save-error" role="alert"></p><div class="save-row"><small>${adminTarget?'학생 본인만 기록을 수정할 수 있습니다.':'체크 후 저장 버튼을 눌러 주세요.'}</small>${!adminTarget?'<button type="submit">학습 기록 저장 ✓</button>':''}</div></form></section></div><aside class="stack"><section class="card"><h2>나의 학습 구간</h2>${[curGrade].map(book=>{const ls=lessonsOf().filter(l=>l.book===book);const done=plan.filter(p=>record(p.day).checks[0]).flatMap(p=>p.lessons).filter(l=>l.book===book).length;return `<div class="period"><p>${book} · ${done} / ${ls.length}강</p><progress value="${done}" max="${ls.length}" aria-label="${book} 진도"></progress></div>`}).join('')}</section><section class="card"><h2>이렇게 공부해요</h2><p class="muted" style="font-size:.875rem">인강 ${p.minutes}분 (선택일 기준)<br>문제 풀이 25~35분<br>채점 5~10분<br>오답 정리 15~20분</p><div class="note">오답이 없다면 채점 결과를 확인한 뒤 오답 항목을 체크하세요.</div></section></aside></div>`}
function adminView(){return `<div class="heading"><div><h1>학생 진도 관리</h1><p>학생별 학습 현황을 확인하고 학습을 도와주세요.</p></div><div class="steps"><button class="secondary" id="refresh">새로고침</button><button id="export-excel">엑셀로 내보내기 ↓</button></div></div><section class="stats"><div class="card stat primary"><small>등록 학생</small><strong>${students.length}명</strong><small>센터에서 관리하는 학습 계정</small></div><div class="card stat"><small>평균 학습 진도</small><strong>${students.length?Math.round(students.reduce((a,s)=>a+metric(s.id,gradeOf(s)).checks/(daysFor(s.id)*4),0)/students.length*1000)/10:0}%</strong></div><div class="card stat"><small>선택 계획 완주 학생</small><strong>${students.filter(s=>metric(s.id,gradeOf(s)).done===daysFor(s.id)).length}명</strong></div></section><section class="card"><h2>학생별 학습 현황</h2><div class="table-wrap"><table><thead><tr><th>학생</th><th>학년</th><th>수업계획</th><th>시작일</th><th>진도율</th><th>완료 일수</th><th>학습 기록</th></tr></thead><tbody>${students.map(s=>{const m=metric(s.id,gradeOf(s));return `<tr><td>${esc(s.name)}</td><td>${esc(s.grade)}</td><td>${daysFor(s.id)}일 계획</td><td>${esc(s.start_date||'미지정')}</td><td>${Math.round(m.checks/(daysFor(s.id)*4)*1000)/10}%<progress value="${m.checks}" max="${daysFor(s.id)*4}" aria-label="${esc(s.name)} 진도율"></progress></td><td>${m.done} / ${daysFor(s.id)}일</td><td><button class="secondary" data-student="${esc(s.id)}">상세 보기</button> <button type="button" class="danger" data-delete-student="${esc(s.id)}">학생 삭제</button></td></tr>`}).join('')||'<tr><td colspan="7">아직 등록된 학생이 없습니다. 아래에서 학생 계정을 발급해 주세요.</td></tr>'}</tbody></table></div></section><div class="admin-tools"><section class="card"><h2>학생 계정 발급</h2><form id="create-student" class="form-grid"><label>이름<input name="name" required maxlength="40"></label><label>학년<select name="grade" required>${Object.keys(GR).map(g=>`<option value="${g}">${g}${GR[g].ready?'':' (준비 중)'}</option>`).join('')}</select></label><label>아이디<input name="username" required pattern="[a-z0-9_-]{3,30}" placeholder="영문 소문자·숫자 3~30자"></label><label>임시 비밀번호<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><label>수업계획<select name="plan_days" required>${[30,50,70].map(n=>`<option value="${n}">${n}일 수업계획</option>`).join('')}</select></label><label>학습 시작일<input type="date" name="start_date" required></label><p class="error full" id="student-error" role="alert"></p><button type="submit" class="full">학생 계정 만들기</button></form></section><section class="card"><h2>학생 비밀번호 재설정</h2><form id="reset-student" class="form-grid"><label class="full">학생<select name="id" required><option value="">학생 선택</option>${students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.grade)}</option>`).join('')}</select></label><label class="full">새 임시 비밀번호<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><p class="error full" id="reset-error" role="alert"></p><button class="secondary full" type="submit">비밀번호 재설정</button></form><p class="muted" style="margin-top:20px;font-size:.875rem">학생에게 아이디와 임시 비밀번호를 개별 안내해 주세요. 학생은 내 계정에서 비밀번호를 변경할 수 있습니다.</p></section></div>`}
function validUrl(s){try{return new URL(s).protocol==='https:'}catch{return false}}
function linksView(){return `<div class="heading"><div><h1>강의 링크 관리</h1><p>강의별 HTTPS 주소를 등록하면 학생 화면에 ‘강의 보기’가 표시됩니다.</p></div></div>${gradeTabs()}`+(GR[curGrade].ready?`<section class="card"><form id="links">${lessonsOf().map(l=>`<div class="link-row"><span class="lesson-num">${lessonLabel(l)}</span><label>${esc(l.title)}<input type="url" name="lecture${l.number}" value="${esc(links.find(x=>x.grade===curGrade&&x.lecture===l.number)?.url||'')}" placeholder="https:// 강의 주소"></label></div>`).join('')}<p class="error" id="link-error" role="alert"></p><button type="submit">강의 링크 저장</button></form></section>`:`<section class="card"><h2>${curGrade} 강의는 준비 중입니다</h2></section>`)}
function accountView(){return `<div class="heading"><div><h1>내 계정</h1><p>${esc(me.name)} · ${esc(me.grade||'관리자')}</p></div></div><section class="card"><h2>비밀번호 변경</h2><form id="password" class="pass-form"><label>새 비밀번호<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><label>새 비밀번호 확인<input name="confirm" type="password" required minlength="10" autocomplete="new-password"></label><button type="submit">변경하기</button></form><p id="password-error" class="error" role="alert"></p></section>`}

function normalizedMistakes(items){return (Array.isArray(items)?items:[]).flatMap(item=>{const nums=String(item.problem||'').match(/\d+/g)||[''];return nums.map(problem=>({...item,problem,reason:item.reason||''}));});}
function mistakeRow(item={},readonly=false){return `<div class="mistake-row"><label>쪽 / 페이지<input data-page maxlength="80" value="${esc(item.page||'')}" placeholder="예: 24쪽" ${readonly?'disabled':''}></label><label>문항 번호 (한 개)<input data-problem type="number" min="1" max="99999" step="1" value="${esc(item.problem||'')}" placeholder="예: 3" ${readonly?'disabled':''}></label><label class="mistake-reason">왜 틀렸나요?<textarea data-reason maxlength="2000" placeholder="예: 분모를 같게 만들지 않고 더했어요. 다음에는 통분부터 할 거예요." ${readonly?'disabled':''}>${esc(item.reason||'')}</textarea></label>${readonly?'':'<button type="button" class="quiet" data-remove-mistake aria-label="오답 줄 삭제">줄 삭제</button>'}</div>`}
function mistakesEditor(r){const items=normalizedMistakes(r.mistakes);return `<section class="full mistakes"><h3>틀린 문제 기록</h3><p class="muted">한 줄에 한 문제씩 적고, 틀린 이유를 남겨주세요.</p><div id="mistake-rows">${(items.length?items:adminTarget?[]:[{}]).map(x=>mistakeRow(x,!!adminTarget)).join('')}</div>${adminTarget?(items.length?'':'<p class="muted">기록한 오답이 없습니다.</p>'):'<button type="button" class="secondary" id="add-mistake">+ 오답 줄 추가</button>'}</section>`}
function bind(){
 if(view==='study'||view==='links')document.querySelectorAll('.grade-tabs [data-grade]').forEach(b=>b.onclick=()=>navigate(()=>{curGrade=b.dataset.grade;const pid=adminTarget||me.id;plan=planFor(pid,curGrade);selected=plan.find(p=>!record(p.day,pid).checks.every(Boolean))?.day||1;render()}));
 if($('#start-date-form'))$('#start-date-form').onsubmit=async e=>{e.preventDefault();if(busy)return;if(dirty&&!confirm('저장하지 않은 학습 기록이 있습니다. 먼저 저장하지 않고 날짜를 바꾸시겠습니까?'))return;const f=new FormData(e.target),start=f.get('start'),days=Number(f.get('plan_days'));busy=true;e.submitter.disabled=true;try{await request('/rest/v1/rpc/set_my_study_plan',{method:'POST',body:{new_date:start,new_days:days}});me.start_date=start;me.plan_days=days;selected=1;warnedOn='';render();toast('선택한 수업계획과 시작일을 적용했습니다.');}catch(x){$('#date-error').textContent=x.message}finally{busy=false;e.submitter.disabled=false}};

 if($('#export-excel'))$('#export-excel').onclick=async e=>{e.target.disabled=true;try{
 await load();
 const summary=[['학생 이름','학년','계획 (일)','시작일','진도율 (%)','완료 일수','수강 강의 수','공부 시간 (분)']];
 const daily=[['학생 이름','학년','일차','예정 학습일','학습 내용','학습 날짜','인강','문제 풀이','채점','오답 정리','전체 문항 수','공부 시간 (분)','학습 메모']];
 const wrong=[['학생 이름','학년','일차','학습 날짜','쪽 / 페이지','문항 번호','왜 틀렸나요?']];
 for(const student of students){const sg=gradeOf(student),m=metric(student.id,sg);summary.push([student.name,student.grade,daysFor(student.id),student.start_date||'',Math.round(m.checks/(daysFor(student.id)*4)*1000)/10,m.done,m.lectures,m.minutes]);for(const p of planFor(student.id,sg)){const r=record(p.day,student.id,sg);daily.push([student.name,student.grade,p.day,plannedDate(student.start_date,p.day),p.review?'복습':p.lessons.map(l=>lessonLabel(l)+' '+l.title).join(' / '),r.study_date||'',...r.checks.map(x=>x?'완료':'미완료'),r.total??'',r.minutes??'',r.note||'']);for(const item of normalizedMistakes(r.mistakes))wrong.push([student.name,student.grade,p.day,r.study_date||'',item.page,Number(item.problem)||item.problem,item.reason||'']);}}
 const blob=window.makeCenterWorkbook([{name:'학생별 요약',rows:summary},{name:'일차별 학습 기록',rows:daily,widths:[18,18,10,18,60,18,12,12,12,12,18,18,60]},{name:'오답 기록',rows:wrong,widths:[18,18,10,18,20,15,65]}]);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='별내스마트러닝센터_학생학습현황_'+new Date().toISOString().slice(0,10)+'.xlsx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('엑셀 파일을 내보냈습니다.');
 }catch(x){toast('엑셀 내보내기 실패: '+x.message)}finally{e.target.disabled=false}};

 if($('#add-mistake'))$('#add-mistake').onclick=()=>{ $('#mistake-rows').insertAdjacentHTML('beforeend',mistakeRow());dirty=true;$('#mistake-rows').lastElementChild.querySelector('input').focus(); };
 if($('#mistake-rows'))$('#mistake-rows').onclick=e=>{const button=e.target.closest('[data-remove-mistake]');if(button){button.closest('.mistake-row').remove();dirty=true;}};
 document.querySelectorAll('[data-delete-student]').forEach(button=>button.onclick=async()=>{const student=students.find(x=>x.id===button.dataset.deleteStudent);if(!student||!confirm(student.name+' 학생 계정과 모든 학습 기록을 영구 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.'))return;button.disabled=true;try{await request('/rest/v1/rpc/delete_center_student',{method:'POST',body:{target_id:student.id}});students=students.filter(x=>x.id!==student.id);records=records.filter(x=>x.student_id!==student.id);render();toast('학생 계정과 학습 기록을 삭제했습니다.');}catch(x){toast(x.message);button.disabled=false;}});
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>navigate(()=>{selected=+b.dataset.day;render()}));document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{adminTarget=b.dataset.student;curGrade=gradeOf(students.find(s=>s.id===adminTarget));selected=1;view='study';render()});
 if($('#daily')){$('#daily').oninput=()=>dirty=true;$('#daily').onsubmit=async e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target);const number=k=>f.get(k)===''?null:Number(f.get(k));const total=number('total');const mistakes=[...document.querySelectorAll('.mistake-row')].map(row=>({page:row.querySelector('[data-page]').value.trim(),problem:row.querySelector('[data-problem]').value.trim(),reason:row.querySelector('[data-reason]').value.trim()})).filter(x=>x.page||x.problem||x.reason);if(mistakes.some(x=>!x.page||!/^\d+$/.test(x.problem)||Number(x.problem)<1||Number(x.problem)>99999)){$('#save-error').textContent='오답마다 쪽/페이지와 문항 번호 한 개(1 이상의 정수)를 입력해 주세요.';return;}const row={student_id:me.id,grade:curGrade,plan_days:daysFor(me.id),day:selected,checks:activities.map((_,i)=>f.has('check'+i)),correct:null,total,mistakes,minutes:number('minutes'),study_date:f.get('study_date')||null,note:f.get('note'),updated_at:new Date().toISOString()};busy=true;e.submitter.disabled=true;try{await request('/rest/v1/progress?on_conflict=student_id,grade,plan_days,day',{method:'POST',body:row,prefer:'resolution=merge-duplicates'});records=records.filter(r=>!(r.student_id===row.student_id&&r.day===row.day&&r.grade===row.grade&&r.plan_days===row.plan_days));records.push(row);render();toast('학습 기록을 저장했습니다.')}catch(x){$('#save-error').textContent=x.message}finally{busy=false;if(e.submitter)e.submitter.disabled=false}}}
 if($('#refresh'))$('#refresh').onclick=async e=>{e.target.disabled=true;try{await load();render();toast('최신 기록을 불러왔습니다.')}catch(x){toast(x.message)}finally{e.target.disabled=false}};
 for(const [id,action,out] of [['create-student','create','student-error'],['reset-student','reset','reset-error']])if($('#'+id))$('#'+id).onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{await request('/functions/v1/manage-student',{method:'POST',body:{action,...Object.fromEntries(new FormData(e.target))}});await load();render();toast(action==='create'?'학생 계정을 발급했습니다.':'비밀번호를 재설정했습니다.')}catch(x){$('#'+out).textContent=x.message}finally{e.submitter.disabled=false}};
 if($('#links')){$('#links').oninput=()=>dirty=true;$('#links').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const f=new FormData(e.target);const rows=lessonsOf().map(l=>({grade:curGrade,lecture:l.number,url:f.get('lecture'+l.number).trim()}));if(rows.some(r=>r.url&&!validUrl(r.url)))throw Error('강의 주소는 https://로 시작하는 주소를 입력해 주세요.');await request('/rest/v1/lecture_links?on_conflict=grade,lecture',{method:'POST',body:rows,prefer:'resolution=merge-duplicates'});links=links.filter(x=>x.grade!==curGrade).concat(rows);dirty=false;toast('강의 링크를 저장했습니다.')}catch(x){$('#link-error').textContent=x.message}finally{e.submitter.disabled=false}}}
 if($('#password'))$('#password').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const f=new FormData(e.target);if(f.get('password')!==f.get('confirm'))throw Error('비밀번호가 서로 다릅니다.');await request('/auth/v1/user',{method:'PUT',body:{password:f.get('password')}});e.target.reset();toast('비밀번호를 변경했습니다.')}catch(x){$('#password-error').textContent=x.message}finally{e.submitter.disabled=false}};
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(navigator.modelContext?.registerTool)navigator.modelContext.registerTool({name:'read_my_math_progress',description:'현재 로그인한 사용자의 저장된 수학 학습 진도와 선택한 학습일의 계획을 조회합니다. 기록을 변경하지 않습니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:async()=>({content:[{type:'text',text:JSON.stringify(me?{day:selected,plan:plan[selected-1],progress:metric(me.id)}:{error:'로그인이 필요합니다.'})}]})});
if(session&&ready){try{await load();view=me.role==='admin'?'admin':'study';render()}catch(x){remember(null);login();toast(x.message)}}else login();

})();
</script></body></html>
