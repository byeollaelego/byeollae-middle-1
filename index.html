 document.querySelectorAll('[data-delete-student]').forEach(button=>button.onclick=async()=>{const student=students.find(x=>x.id===button.dataset.deleteStudent);if(!student||!confirm(student.name+' 학생 계정과 모든 학습 기록을 영구 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.'))return;button.disabled=true;try{await request('/rest/v1/rpc/delete_center_student',{method:'POST',body:{target_id:student.id}});students=students.filter(x=>x.id!==student.id);records=records.filter(x=>x.student_id!==student.id);render();toast('학생 계정과 학습 기록을 삭제했습니다.');}catch(x){toast(x.message);button.disabled=false;}});
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>navigate(()=>{selected=+b.dataset.day;render()}));document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{adminTarget=b.dataset.student;curGrade=gradeOf(students.find(s=>s.id===adminTarget));selected=1;view='study';render()});
 if($('#daily')){$('#daily').oninput=()=>dirty=true;$('#daily').onsubmit=async e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target);const number=k=>f.get(k)===''?null:Number(f.get(k));const total=number('total');const mistakes=[...document.querySelectorAll('.mistake-row')].map(row=>({page:row.querySelector('[data-page]').value.trim(),problem:row.querySelector('[data-problem]').value.trim(),reason:row.querySelector('[data-reason]').value.trim()})).filter(x=>x.page||x.problem||x.reason);if(mistakes.some(x=>!x.page||!/^\d+$/.test(x.problem)||Number(x.problem)<1||Number(x.problem)>99999)){$('#save-error').textContent='오답마다 쪽/페이지와 문항 번호 한 개(1 이상의 정수)를 입력해 주세요.';return;}const row={student_id:me.id,grade:curGrade,plan_days:daysFor(me.id),day:selected,checks:activities.map((_,i)=>f.has('check'+i)),correct:null,total,mistakes,minutes:number('minutes'),study_date:f.get('study_date')||null,note:f.get('note'),updated_at:new Date().toISOString()};busy=true;e.submitter.disabled=true;try{await request('/rest/v1/progress?on_conflict=student_id,grade,plan_days,day',{method:'POST',body:row,prefer:'resolution=merge-duplicates'});records=records.filter(r=>!(r.student_id===row.student_id&&r.day===row.day&&r.grade===row.grade&&r.plan_days===row.plan_days));records.push(row);render();toast('학습 기록을 저장했습니다.')}catch(x){$('#save-error').textContent=x.message}finally{busy=false;if(e.submitter)e.submitter.disabled=false}}}
 if($('#refresh'))$('#refresh').onclick=async e=>{e.target.disabled=true;try{await load();render();toast('최신 기록을 불러왔습니다.')}catch(x){toast(x.message)}finally{e.target.disabled=false}};
 for(const [id,action,out] of [['create-student','create','student-error'],['reset-student','reset','reset-error']])if($('#'+id))$('#'+id).onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{await request('/functions/v1/manage-student',{method:'POST',body:{action,...Object.fromEntries(new FormData(e.target))}});await load();render();toast(action==='create'?'학생 계정을 발급했습니다.':'비밀번호를 재설정했습니다.')}catch(x){$('#'+out).textContent=x.message}finally{e.submitter.disabled=false}};
 if($('#links')){$('#links').oninput=()=>dirty=true;$('#links').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const f=new FormData(e.target);const rows=lessonsOf().map(l=>({grade:curGrade,lecture:l.number,url:f.get('lecture'+l.number).trim()}));if(rows.some(r=>r.url&&!validUrl(r.url)))throw Error('강의 주소는 https://로 시작하는 주소를 입력해 주세요.');await request('/rest/v1/lecture_links?on_conflict=grade,lecture',{method:'POST',body:rows,prefer:'resolution=merge-duplicates'});links=links.filter(x=>x.grade!==curGrade).concat(rows);dirty=false;toast('강의 링크를 저장했습니다.')}catch(x){$('#link-error').textContent=x.message}finally{e.submitter.disabled=false}}}
 if($('#password'))$('#password').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const f=new FormData(e.target);if(f.get('password')!==f.get('confirm'))throw Error('비밀번호가 서로 다릅니다.');await request('/auth/v1/user',{method:'PUT',body:{password:f.get('password')}});e.target.reset();toast('비밀번호를 변경했습니다.')}catch(x){$('#password-error').textContent=x.message}finally{e.submitter.disabled=false}};
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(navigator.modelContext?.registerTool)navigator.modelContext.registerTool({name:'read_my_math_progress',description:'현재 로그인한 사용자의 저장된 수학 학습 진도와 선택한 학습일의 계획을 조회합니다. 기록을 변경하지 않습니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:async()=>({content:[{type:'text',text:JSON.stringify(me?{day:selected,plan:plan[selected-1],progress:metric(me.id)}:{error:'로그인이 필요합니다.'})}]})});
if(session&&ready){try{await load();view=me.role==='admin'?'admin':'study';render()}catch(x){remember(null);login();toast(x.message)}}else login();

})();
</script></body></html>
